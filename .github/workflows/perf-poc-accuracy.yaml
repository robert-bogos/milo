name: Performance check accuracy (POC)

# Proof of concept for robert-bogos/milo only; see .github/performance-poc/README.md.
on:
  push:
    branches: [perf-poc-accuracy]

permissions:
  contents: read

concurrency:
  group: perf-poc-accuracy
  cancel-in-progress: true

defaults:
  run:
    working-directory: .github/performance

jobs:
  matrix:
    name: Plan the runs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build the matrix
        id: matrix
        working-directory: .
        # Each group: pages x scenarios x settings x rounds. Scenarios: aa (A/A), cpuN (N ms of
        # main-thread work at page start), clsN (an N px layout shift after the first content).
        env:
          MATRIX_GROUPS: >-
            [{"pages":["homepage"],"scenarios":["cpu50","cpu80","cpu120"],"rounds":4},{"pages":["acrobat"],"scenarios":["cpu150","cpu200","cpu275"],"rounds":4},{"pages":["business"],"scenarios":["cpu150","cpu200","cpu250"],"rounds":4},{"pages":["photoshop"],"scenarios":["cpu300","cpu400","cpu550"],"rounds":4},{"pages":["homepage","acrobat"],"scenarios":["cls6"],"rounds":4},{"pages":["firefly","photoshop"],"scenarios":["cls6","cls10"],"rounds":2},{"pages":["creativity-design","firefly-landpa"],"scenarios":["cls10","cls20"],"rounds":2},{"pages":["acrobat-plans","pdf-essentials","special-offers","homepage","firefly-plans"],"scenarios":["aa"],"settings":["default","quiet"],"rounds":2}]
        run: |
          node -e '
            const include = [];
            JSON.parse(process.env.MATRIX_GROUPS).forEach((group) => {
              for (let round = 1; round <= group.rounds; round += 1) {
                group.pages.forEach((page) => group.scenarios.forEach((scenario) => (group.settings || ["default"])
                  .forEach((settings) => include.push({ page, scenario, settings, round }))));
              }
            });
            console.log(`matrix=${JSON.stringify({ include })}`);
            console.error(`${include.length} jobs`);
          ' >> "$GITHUB_OUTPUT"

  measure:
    name: ${{ matrix.page }} ${{ matrix.scenario }} ${{ matrix.settings }} round ${{ matrix.round }}
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - name: Check out the tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: |
            .github/performance
            .github/performance-poc
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/performance/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Set up Chrome
        run: node cli.js chrome

      - name: Measure
        env:
          POC_PAGE: ${{ matrix.page }}
          POC_SCENARIO: ${{ matrix.scenario }}
          POC_SETTINGS: ${{ matrix.settings }}
          POC_ROUND: ${{ matrix.round }}
          POC_PAIRS: 15
          POC_WARMUPS: 2
          POC_OUT: ${{ github.workspace }}/accuracy/${{ matrix.page }}-${{ matrix.scenario }}-${{ matrix.settings }}-r${{ matrix.round }}.jsonl
        run: node ../performance-poc/accuracy2.mjs "$POC_PAGE" "$POC_SCENARIO"

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acc2-${{ matrix.page }}-${{ matrix.scenario }}-${{ matrix.settings }}-r${{ matrix.round }}
          path: ${{ github.workspace }}/accuracy/
          retention-days: 14
