name: Performance check

# Measures the pages a pull request affects with adobecom/perf-tools, before and after the change,
# and comments the result. Off unless the repository variable PERF_CHECKS is "on".
# See .github/performance/README.md.
on:
  pull_request:
    branches: [stage]
    types: [opened, reopened, synchronize, ready_for_review, edited]

permissions:
  contents: read

# A push or a description edit (demo URLs) restarts the check; other edits leave it running.
concurrency:
  group: performance-check-${{ github.event.pull_request.number }}-${{ github.event.action == 'edited' && !github.event.changes.body && !github.event.changes.base && github.run_id || 'latest' }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: perf-tooling/.github/performance

env:
  PERF_OUT_DIR: ${{ github.workspace }}/perf-output
  # adobecom/perf-tools (perf-ab) at a reviewed commit; its lib/ is loaded as code.
  PERF_TOOLS_REF: f8344b62b4744b7fbf768caaee36366c3ad65c4c

jobs:
  plan:
    name: Find affected pages
    if: >-
      vars.PERF_CHECKS == 'on' && !github.event.pull_request.draft
      && (github.event.action != 'edited' || github.event.changes.body || github.event.changes.base)
    runs-on: ${{ vars.PERF_RUNNER || 'gh-hosted' }}
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
      measure: ${{ steps.plan.outputs.measure }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      # The tooling comes from the base branch, so a pull request cannot change its own check.
      # The event's base.sha is the base branch when the pull request was opened, so the current
      # tip is checked out instead and every later job uses that same commit.
      - name: Check out the performance tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: perf-tooling
          sparse-checkout: .github/performance
          persist-credentials: false

      - name: Record the base commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Only the git history is needed: the changed files, the merge base and the contents of the
      # swapped files, which git downloads on demand.
      - name: Fetch the pull request history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github/performance
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: perf-tooling/.github/performance/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Set up Chrome
        run: node cli.js chrome

      - name: Find the pages that load the changed code
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PERF_BASE_SHA: ${{ steps.base.outputs.sha }}
          PERF_REPO_DIR: ${{ github.workspace }}/pr
        run: node cli.js plan

      - name: Upload the plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-plan
          path: ${{ env.PERF_OUT_DIR }}/plan.json
          retention-days: 14

      # The before and after versions of the files that perf-tools swaps into the pages.
      - name: Upload the swapped files
        if: steps.plan.outputs.measure == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-sources
          path: ${{ env.PERF_OUT_DIR }}/sources
          retention-days: 14
          if-no-files-found: error

  measure:
    name: Measure ${{ matrix.label }}
    needs: plan
    if: needs.plan.outputs.measure == 'true'
    runs-on: ${{ vars.PERF_RUNNER || 'gh-hosted' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out the performance tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.plan.outputs.base_sha || github.event.pull_request.base.ref }}
          path: perf-tooling
          sparse-checkout: .github/performance
          persist-credentials: false

      - name: Check out perf-tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: adobecom/perf-tools
          ref: ${{ env.PERF_TOOLS_REF }}
          path: perf-engine
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            perf-tooling/.github/performance/package-lock.json
            perf-engine/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install perf-tools
        working-directory: perf-engine
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund

      # perf-tools rejects a load without a Speed Index, which does not gate here. Pages that
      # are covered late in the load (acrobat.html on US runners) get a Speed Index of 0.
      - name: Make Speed Index optional in perf-tools
        working-directory: perf-engine
        run: |
          sed -i "s/^export const REQUIRED_KEYS = \['FCP', 'LCP', 'SI', 'CLS'\];$/export const REQUIRED_KEYS = ['FCP', 'LCP', 'CLS'];/" lib/pagespeed/stats.mjs
          grep -q "^export const REQUIRED_KEYS = \['FCP', 'LCP', 'CLS'\];$" lib/pagespeed/stats.mjs

      - name: Set up Chrome
        run: node cli.js chrome

      - name: Download the swapped files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: perf-sources
          path: ${{ runner.temp }}/sources

      - name: Measure before and after
        id: measure
        env:
          PERF_PAGE: ${{ toJSON(matrix) }}
          PERF_SOURCES_DIR: ${{ runner.temp }}/sources
          PERF_TOOLS_DIR: ${{ github.workspace }}/perf-engine
        run: node cli.js measure

      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-r1-${{ matrix.id }}
          path: ${{ env.PERF_OUT_DIR }}/result-*.json
          retention-days: 14

      # Lighthouse reports of every run, for pages that did not pass. The HTML report includes the
      # report JSON. Traces (up to about 65 MB each) are kept for the first two pairs only, one in
      # each order.
      - name: Upload the Lighthouse reports
        if: ${{ !cancelled() && (steps.measure.outputs.traces == 'true' || failure()) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-traces-r1-${{ matrix.id }}
          path: |
            ${{ env.PERF_OUT_DIR }}/engine
            !${{ env.PERF_OUT_DIR }}/engine/**/devtoolslog.json
            !${{ env.PERF_OUT_DIR }}/engine/**/report.json
            !${{ env.PERF_OUT_DIR }}/engine/**/rejected/**/trace.json
            !${{ env.PERF_OUT_DIR }}/engine/**/pair[3-9]/**/trace.json
            !${{ env.PERF_OUT_DIR }}/engine/**/pair1[0-9]/**/trace.json
          retention-days: 7
          if-no-files-found: ignore

  triage:
    name: Pick pages to re-measure
    needs: [plan, measure]
    if: ${{ !cancelled() && needs.plan.outputs.measure == 'true' }}
    runs-on: ${{ vars.PERF_RUNNER || 'gh-hosted' }}
    timeout-minutes: 10
    outputs:
      confirm: ${{ steps.triage.outputs.confirm }}
      matrix: ${{ steps.triage.outputs.matrix }}
    steps:
      - name: Check out the performance tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.plan.outputs.base_sha || github.event.pull_request.base.ref }}
          path: perf-tooling
          sparse-checkout: .github/performance
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Download the plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: perf-plan
          path: ${{ runner.temp }}/plan

      - name: Download the measurements
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: perf-r1-*
          merge-multiple: true
          path: ${{ runner.temp }}/results

      # Failing pages are measured again on a new runner; a failure counts only if it repeats.
      - name: Pick failing pages
        id: triage
        env:
          PERF_PLAN: ${{ runner.temp }}/plan/plan.json
          PERF_RESULTS_DIR: ${{ runner.temp }}/results
        run: node cli.js triage

  confirm:
    name: Re-measure ${{ matrix.label }}
    needs: [plan, triage]
    if: ${{ !cancelled() && needs.triage.result == 'success' && needs.triage.outputs.confirm == 'true' }}
    runs-on: ${{ vars.PERF_RUNNER || 'gh-hosted' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.triage.outputs.matrix) }}
    steps:
      - name: Check out the performance tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.plan.outputs.base_sha || github.event.pull_request.base.ref }}
          path: perf-tooling
          sparse-checkout: .github/performance
          persist-credentials: false

      - name: Check out perf-tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: adobecom/perf-tools
          ref: ${{ env.PERF_TOOLS_REF }}
          path: perf-engine
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            perf-tooling/.github/performance/package-lock.json
            perf-engine/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install perf-tools
        working-directory: perf-engine
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund

      # perf-tools rejects a load without a Speed Index, which does not gate here. Pages that
      # are covered late in the load (acrobat.html on US runners) get a Speed Index of 0.
      - name: Make Speed Index optional in perf-tools
        working-directory: perf-engine
        run: |
          sed -i "s/^export const REQUIRED_KEYS = \['FCP', 'LCP', 'SI', 'CLS'\];$/export const REQUIRED_KEYS = ['FCP', 'LCP', 'CLS'];/" lib/pagespeed/stats.mjs
          grep -q "^export const REQUIRED_KEYS = \['FCP', 'LCP', 'CLS'\];$" lib/pagespeed/stats.mjs

      - name: Set up Chrome
        run: node cli.js chrome

      - name: Download the swapped files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: perf-sources
          path: ${{ runner.temp }}/sources

      - name: Measure before and after again
        id: measure
        env:
          PERF_PAGE: ${{ toJSON(matrix) }}
          PERF_SOURCES_DIR: ${{ runner.temp }}/sources
          PERF_TOOLS_DIR: ${{ github.workspace }}/perf-engine
        run: node cli.js measure

      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-r2-${{ matrix.id }}
          path: ${{ env.PERF_OUT_DIR }}/result-*.json
          retention-days: 14

      # Lighthouse reports of every run, for pages that did not pass. The HTML report includes the
      # report JSON. Traces (up to about 65 MB each) are kept for the first two pairs only, one in
      # each order.
      - name: Upload the Lighthouse reports
        if: ${{ !cancelled() && (steps.measure.outputs.traces == 'true' || failure()) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-traces-r2-${{ matrix.id }}
          path: |
            ${{ env.PERF_OUT_DIR }}/engine
            !${{ env.PERF_OUT_DIR }}/engine/**/devtoolslog.json
            !${{ env.PERF_OUT_DIR }}/engine/**/report.json
            !${{ env.PERF_OUT_DIR }}/engine/**/rejected/**/trace.json
            !${{ env.PERF_OUT_DIR }}/engine/**/pair[3-9]/**/trace.json
            !${{ env.PERF_OUT_DIR }}/engine/**/pair1[0-9]/**/trace.json
          retention-days: 7
          if-no-files-found: ignore

  report:
    name: Report
    needs: [plan, measure, triage, confirm]
    # Superseded runs are cancelled and must not overwrite the newer report.
    if: ${{ !cancelled() && needs.plan.result != 'skipped' }}
    runs-on: ${{ vars.PERF_RUNNER || 'gh-hosted' }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out the performance tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.plan.outputs.base_sha || github.event.pull_request.base.ref }}
          path: perf-tooling
          sparse-checkout: .github/performance
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Download the plan
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: perf-plan
          path: ${{ runner.temp }}/plan

      - name: Download the measurements
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: perf-r*
          merge-multiple: true
          path: ${{ runner.temp }}/results

      # Fork pull requests get a read-only token; the report is then only in the job summary.
      - name: Report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PERF_PLAN: ${{ runner.temp }}/plan/plan.json
          PERF_RESULTS_DIR: ${{ runner.temp }}/results
          PERF_ENFORCE: ${{ vars.PERF_ENFORCE }}
        run: node cli.js report

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-report
          path: ${{ env.PERF_OUT_DIR }}/report.json
          retention-days: 14
